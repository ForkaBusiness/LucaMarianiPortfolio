    <script>
      // If this page is a stale copy from before a redeploy, its JS/CSS files
      // no longer exist. Reload once to fetch the current version instead of
      // showing a blank screen.
      (function () {
        function recover(e) {
          var t = e && e.target;
          var src = t && (t.src || t.href);
          if (!src || src.indexOf("/assets/") === -1) return;
          try {
            if (sessionStorage.getItem("asset-reload")) return;
            sessionStorage.setItem("asset-reload", "1");
          } catch (_) {}
          location.reload();
        }
        window.addEventListener("error", recover, true);
        window.addEventListener("vite:preloadError", function () { recover({ target: { src: "/assets/" } }); });
        window.addEventListener("load", function () {
          setTimeout(function () { try { sessionStorage.removeItem("asset-reload"); } catch (_) {} }, 5000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
